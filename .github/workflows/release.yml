name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag, VERSION and Cargo versions agree
        run: |
          TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $TAG is not of the form vX.Y.Z"; exit 1 ;;
          esac
          V="${TAG#v}"
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          WS_V="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          CORE_V="$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)"
          echo "tag=$V VERSION=$FILE_V workspace=$WS_V core=$CORE_V"
          [ -n "$V" ] && [ "$V" = "$FILE_V" ] && [ "$V" = "$WS_V" ] && [ "$V" = "$CORE_V" ] \
            || { echo "version mismatch"; exit 1; }
      - run: cargo test --release
      - run: scripts/build.sh
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent build/Bossa.app "build/Bossa-$V-macos-arm64.zip"
          (cd build && shasum -a 256 "Bossa-$V-macos-arm64.zip" > "Bossa-$V-macos-arm64.zip.sha256")
      - name: Release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -n "/^## \[$V\]/,/^## /p" CHANGELOG.md | sed -e '1d' -e '/^## /d' > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            printf '\n---\n\nBossa is ad-hoc signed and not notarized. After moving it to Applications, clear the quarantine flag once:\n\n```\nxattr -dr com.apple.quarantine /Applications/Bossa.app\n```\n' >> notes.md
          else
            rm -f notes.md
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          ASSETS=("build/Bossa-$V-macos-arm64.zip" "build/Bossa-$V-macos-arm64.zip.sha256")
          if [ -f notes.md ]; then NOTES=(--notes-file notes.md); else NOTES=(--generate-notes); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            [ -f notes.md ] && gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" --clobber "${ASSETS[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "Bossa $V" "${NOTES[@]}" "${ASSETS[@]}"
          fi
