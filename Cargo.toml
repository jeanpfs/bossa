[workspace]
resolver = "2"
members = ["core", "crates/bose-bmap", "crates/bose-transport", "crates/bose-cli"]

[workspace.package]
edition = "2021"
version = "0.1.2"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
